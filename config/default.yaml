app:
  random_state: 42

data:
  timestamp_column: timestamp
  target_column: pm25
  # Rows sharing a timestamp mean the file holds more than one series (e.g. several
  # co-located devices). error | first | last | mean | median. Keeping one arbitrary
  # row per timestamp interleaves the devices, so that is not the default.
  duplicate_timestamps: error
  # Column identifying the device/site, and which one to keep. Leave null to be
  # prompted, or set both to select a single series non-interactively.
  device_column: null
  reference_device: null
  sensor_device: null
  timezone: UTC
  sensor_prefix: sensor
  reference_prefix: reference

preprocessing:
  missing_strategy: linear_interpolation_forward_fill
  outlier_method: iqr
  outlier_threshold: 1.5
  # A row is dropped when ANY screened column calls it an outlier, so the loss
  # compounds with column count even on clean data (~11% of rows across 16
  # independent gaussian columns). Name columns here to screen only those.
  outlier_columns: []
  reference:
    missing_strategy: linear_interpolation_forward_fill
    outlier_method: none
    outlier_threshold: 1.5
  sensor:
    missing_strategy: linear_interpolation_forward_fill
    outlier_method: iqr
    outlier_threshold: 1.5

alignment:
  resample_rule: 1h
  aggregation: mean
  max_lag_steps: 0
  lag_column: auto
  merge_strategy: inner

feature_engineering:
  enabled: true
  lag_steps: []
  rolling_windows: []
  rolling_std: false
  add_time_features: false
  optional_columns:
    - sensor_temperature
    - sensor_humidity
    - sensor_voc

normalization:
  method: none

training:
  test_size: 0.2
  # Reference-prefixed columns are readings from the instrument being calibrated
  # against; a deployed sensor will not have them. Set true only for co-location
  # analysis where using them is the point.
  include_reference_predictors: false
  # Columns that reconstruct the target algebraically (e.g. a
  # sensor-minus-reference difference) are detected and dropped. Set true
  # only if you know a flagged column is genuinely independent.
  include_target_encoding_predictors: false
  cross_validation_folds: 5
  validation_method: timeseriessplit
  selected_models:
    - ols_regression
    - multiple_linear_regression
    - ridge
    - lasso
    - random_forest
    - xgboost
  model_params:
    ridge:
      alpha: 1.0
    lasso:
      alpha: 0.01
    random_forest:
      n_estimators: 200
      max_depth: 10
    xgboost:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.05
  modelling_objective: null

evaluation:
  sort_by: rmse
  ascending: true

