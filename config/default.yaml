app:
  random_state: 42

data:
  timestamp_column: timestamp
  target_column: pm25
  timezone: UTC
  sensor_prefix: sensor
  reference_prefix: reference

preprocessing:
  missing_strategy: linear_interpolation_forward_fill
  outlier_method: iqr
  outlier_threshold: 1.5
  reference:
    missing_strategy: linear_interpolation_forward_fill
    outlier_method: none
    outlier_threshold: 1.5
  sensor:
    missing_strategy: linear_interpolation_forward_fill
    outlier_method: iqr
    outlier_threshold: 1.5

alignment:
  resample_rule: 1h
  aggregation: mean
  max_lag_steps: 0
  lag_column: auto
  merge_strategy: inner

feature_engineering:
  enabled: true
  lag_steps: []
  rolling_windows: [3, 6]
  rolling_std: true
  add_time_features: true
  optional_columns:
    - sensor_temperature
    - sensor_humidity
    - sensor_voc

normalization:
  method: none

validation:
  method: timeseriessplit

modelling:
  objective: null

training:
  test_size: 0.2
  cross_validation_folds: 5
  validation_method: timeseriessplit
  selected_models:
    - ols_regression
    - multiple_linear_regression
    - ridge
    - lasso
    - random_forest
    - xgboost
  model_params:
    ridge:
      alpha: 1.0
    lasso:
      alpha: 0.01
    random_forest:
      n_estimators: 200
      max_depth: 10
    xgboost:
      n_estimators: 200
      max_depth: 4
      learning_rate: 0.05
  modelling_objective: null

evaluation:
  sort_by: rmse
  ascending: true

drift_analysis:
  rolling_window: 6
  drift_threshold: 1.5
