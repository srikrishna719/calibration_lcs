[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    slow: full pipeline / multi-model runs (deselect with '-m "not slow"')
    realdata: needs data/processed_2025_trends, which is gitignored; skipped when absent
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
